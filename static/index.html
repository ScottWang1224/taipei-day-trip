<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台北一日遊</title>

    <link rel="stylesheet" href="/static/css/index.css" />
    <link rel="stylesheet" href="/static/css/auth.css" />
  </head>

  <body>
    <!-- Navigation -->
    <header class="navigation">
      <nav class="navigation-container">
        <a href="/" class="logo">台北一日遊</a>

        <div class="navigation-menu">
          <a href="#" id="booking-nav">預定行程</a>
          <a href="#" id="member-action">登入/註冊</a>
        </div>
      </nav>
    </header>

    <main>
      <!-- Hero -->
      <section class="hero">
        <div class="hero-content">
          <div class="hero-inner">
            <div class="slogan">
              <h1>輕鬆享受台北一日悠閒</h1>
              <p>探索每個角落，體驗城市的深度旅遊行程</p>
            </div>

            <div class="search">
              <div class="search-bar">
                <button class="category-selector" type="button">
                  全部分類 ▼
                </button>

                <input
                  class="search-input"
                  type="text"
                  placeholder="輸入景點名稱查詢"
                />

                <button class="search-button" type="button" aria-label="搜尋">
                  <img src="/static/images/search.png" alt="" />
                </button>
              </div>

              <div class="category-menu" hidden></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Attraction Section -->
      <section class="attraction-section">
        <div class="list-bar">
          <div class="arrow-container arrow-left">
            <button class="arrow-button" type="button" aria-label="往左">
              <img src="/static/images/btn_rightArrow.png" alt="" />
            </button>
          </div>

          <div class="mrt-container">
            <div class="mrt-list"></div>
          </div>

          <div class="arrow-container arrow-right">
            <button class="arrow-button" type="button" aria-label="往右">
              <img src="/static/images/btn_rightArrow.png" alt="" />
            </button>
          </div>
        </div>

        <div class="attractions"></div>
      </section>
    </main>

    <footer class="footer">COPYRIGHT © 2021 台北一日遊</footer>

    <!-- Authentication Dialog -->
    <div class="auth-modal" id="auth-modal" hidden>
      <div class="auth-backdrop"></div>

      <!-- Sign In -->
      <section
        class="auth-dialog signin-dialog"
        id="signin-dialog"
        aria-label="登入會員帳號"
      >
        <div class="dialog-decorator"></div>

        <button class="dialog-close" type="button" aria-label="關閉登入視窗">
          ×
        </button>

        <div class="dialog-main">
          <h2 class="dialog-title">登入會員帳號</h2>

          <div class="dialog-container">
            <input
              class="dialog-input"
              id="signin-email"
              type="email"
              placeholder="輸入電子信箱"
            />

            <input
              class="dialog-input"
              id="signin-password"
              type="password"
              placeholder="輸入密碼"
            />

            <button class="dialog-submit" id="signin-submit" type="button">
              登入帳戶
            </button>

            <div class="dialog-message" id="signin-message"></div>

            <button class="dialog-switch" id="show-signup" type="button">
              還沒有帳戶？點此註冊
            </button>
          </div>
        </div>
      </section>

      <!-- Sign Up -->
      <section
        class="auth-dialog signup-dialog"
        id="signup-dialog"
        aria-label="註冊會員帳號"
        hidden
      >
        <div class="dialog-decorator"></div>

        <button class="dialog-close" type="button" aria-label="關閉註冊視窗">
          ×
        </button>

        <div class="dialog-main">
          <h2 class="dialog-title">註冊會員帳號</h2>

          <div class="dialog-container">
            <input
              class="dialog-input"
              id="signup-name"
              type="text"
              placeholder="輸入姓名"
            />

            <input
              class="dialog-input"
              id="signup-email"
              type="email"
              placeholder="輸入電子信箱"
            />

            <input
              class="dialog-input"
              id="signup-password"
              type="password"
              placeholder="輸入密碼"
            />

            <button class="dialog-submit" id="signup-submit" type="button">
              註冊新帳戶
            </button>

            <div class="dialog-message" id="signup-message"></div>

            <button class="dialog-switch" id="show-signin" type="button">
              已經有帳戶了？點此登入
            </button>
          </div>
        </div>
      </section>
    </div>

    <script src="/static/js/index.js"></script>
    <script src="/static/js/auth.js"></script>
  </body>
</html>
